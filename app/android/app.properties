# L'application — identité publiée.
#
# Ce fichier est versionné, et c'est le seul endroit où l'`applicationId` est écrit. Gradle
# le lit au build (app/build.gradle.kts), les scripts de deploy/ le lisent pour nommer l'APK
# et la fiche du dépôt F-Droid. Deux valeurs qui divergent produiraient un dépôt annonçant une
# application que l'APK n'est pas, sans que rien ne le signale.

# ⚠ Ne se change plus après la première publication.
#
# Android identifie une application par son applicationId. Le changer donne une application
# différente : le dépôt F-Droid la présente comme une nouveauté, personne ne reçoit de mise à
# jour, et les deux cohabitent sur le téléphone de qui installe les deux. C'est la décision
# que la spec laissait ouverte « avant la semaine 7 » (SPEC §12.6) — c'est maintenant.
#
# Le nom se lit à l'envers, comme un nom de domaine : `me.safe` annonce « safe.me ». Le choisir
# sur un domaine qu'on ne contrôle pas n'a aucun effet technique, mais F-Droid le lit comme une
# revendication d'appartenance.
applicationId=mov.safecity

# Le `namespace` Kotlin reste `me.safe` et n'est PAS ici, volontairement. Il nomme la classe R
# et sert à résoudre les noms relatifs du manifeste (`.MainActivity`), donc il suit l'arborescence
# des sources : le changer voudrait dire déplacer les fichiers de
# android/app/src/main/kotlin/me/safe/. Android n'exige pas qu'il soit égal à l'applicationId,
# et c'est précisément ce qui permet de trancher l'identité publiée sans toucher au code.

# Le nom sous lequel l'application est publiée : `AuthorName` de la fiche F-Droid, et sujet
# (`CN=`) des deux clés — celle qui signe l'APK et celle qui signe l'index du dépôt. Lu par les
# scripts de deploy/, jamais par l'app elle-même.
author=cyclingboy

# La phrase qui présente l'app, en une ligne : en tête de la page de téléchargement /apk et
# en `Summary` de la fiche F-Droid. Lue par les scripts de deploy/, jamais par l'app — le texte
# d'accueil de l'app, lui, est dans lib/src/ui/labels.dart. Se change librement.
summary=Signalement collaboratif des dangers dans l'espace public, sans compte et sans mouchard.
